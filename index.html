<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Chat</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#212121;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  height:60px;
  display:flex;
  align-items:center;
  padding:0 18px;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #444;
}

#chat{
  padding:15px;
  padding-bottom:90px;
  max-width:900px;
  margin:auto;
}

.msg{
  padding:14px 16px;
  margin:12px 0;
  border-radius:14px;
  white-space:pre-wrap;
  line-height:1.5;
}

.user{
  background:#343541;
}

.bot{
  background:#2b2b2b;
}

.box{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  gap:8px;
  padding:10px;
  background:#212121;
  border-top:1px solid #444;
}

textarea{
  flex:1;
  height:48px;
  resize:none;
  border-radius:14px;
  border:1px solid #555;
  background:#303030;
  color:white;
  padding:12px;
  font-size:16px;
  outline:none;
}

button{
  width:55px;
  border:0;
  border-radius:14px;
  background:#10a37f;
  color:white;
  font-size:22px;
}

button:active{
  transform:scale(.95);
}
</style>
</head>

<body>

<header>🤖 SK Chat</header>

<div id="chat">

<div class="msg bot">
नमस्कार! 👋
मी SK Chat आहे.

मला काहीही विचार.
</div>

</div>

<div class="box">

<textarea
id="input"
placeholder="Message SK Chat..."
></textarea>

<button onclick="send()">➤</button>

</div>

<script>

async function send(){

const input = document.getElementById("input");
const text = input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value = "";

const loading = addMessage("विचार करत आहे...","bot");

try{

const response = await fetch(
"https://chat-sk.onrender.com/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
}
);

if(!response.ok){
throw new Error("Server error");
}

const data = await response.json();

loading.textContent = data.reply || "उत्तर मिळाले नाही.";

}catch(error){

loading.textContent =
"Server शी connection होत नाही. पुन्हा प्रयत्न कर.";

}

}

function addMessage(text,type){

const chat = document.getElementById("chat");

const div = document.createElement("div");

div.className = "msg " + type;

div.textContent = text;

chat.appendChild(div);

window.scrollTo(
0,
document.body.scrollHeight
);

return div;

}

document
.getElementById("input")
.addEventListener(
"keydown",
function(e){

if(e.key === "Enter" && !e.shiftKey){

e.preventDefault();

send();

}

});

</script>

</body>
</html>
