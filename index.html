<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SK Chat</title>

<style>
body{
 margin:0;
 background:#212121;
 color:white;
 font-family:Arial;
}

header{
 padding:18px;
 font-size:22px;
 font-weight:bold;
 border-bottom:1px solid #444;
}

#chat{
 padding:15px;
 padding-bottom:90px;
}

.msg{
 max-width:800px;
 margin:12px auto;
 padding:15px;
 border-radius:12px;
 white-space:pre-wrap;
}

.user{
 background:#343541;
}

.bot{
 background:#2b2b2b;
}

.box{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 padding:10px;
 background:#212121;
 display:flex;
 gap:8px;
}

textarea{
 flex:1;
 height:45px;
 border-radius:12px;
 background:#303030;
 color:white;
 border:1px solid #555;
 padding:10px;
 font-size:16px;
}

button{
 width:60px;
 border:0;
 border-radius:12px;
 background:#10a37f;
 color:white;
 font-size:20px;
}
</style>
</head>

<body>

<header>🤖 SK Chat</header>

<div id="chat">

<div class="msg bot">
नमस्कार! 👋
मी SK Chat आहे.
मला काहीही विचार.
</div>

</div>

<div class="box">

<textarea
id="input"
placeholder="Message SK Chat..."
></textarea>

<button onclick="send()">➤</button>

</div>

<script>

function send(){

 const input=document.getElementById("input");
 const text=input.value.trim();

 if(!text)return;

 add("You",text,"user");

 input.value="";

 setTimeout(function(){

   add(
     "SK Chat",
     answer(text),
     "bot"
   );

 },500);

}

function add(name,text,type){

 const chat=document.getElementById("chat");

 const div=document.createElement("div");

 div.className="msg "+type;

 div.textContent=name+"\n"+text;

 chat.appendChild(div);

 chat.scrollTop=chat.scrollHeight;

}

function answer(text){

 const q=text.toLowerCase();

 if(q.includes("hi")||q.includes("hello"))
   return "Hello! 👋 मी SK Chat आहे.";

 if(q.includes("name")||q.includes("नाव"))
   return "माझं नाव SK Chat आहे. 🤖";

 if(q.includes("html"))
   return "HTML वापरून website तयार करता येते.";

 if(q.includes("game")||q.includes("गेम"))
   return "JavaScript वापरून browser game तयार करता येतो. 🎮";

 return "तुझा प्रश्न मिळाला 👍\n\nहा सध्या मोफत SK Chat demo आहे.";
}

</script>

</body>
  </html>
